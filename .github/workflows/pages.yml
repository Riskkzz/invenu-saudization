# ينشر نسخة المتصفح على GitHub Pages عند كل دفع إلى main.
# فعّلها مرة واحدة: Settings ← Pages ← Source: GitHub Actions
name: deploy-web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - uses: actions/cache@v4
        with:
          path: .cache/web-build
          key: web-build-${{ hashFiles('packaging/build_web.py') }}
      - run: python packaging/build_web.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
